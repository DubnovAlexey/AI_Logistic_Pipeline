<!DOCTYPE html>
<html lang = "ru">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>GameHub: AI Logistic Pipeline</title>
	
	<!-- Подключение Tailwind CSS (внешний движок стилей) -->
    <script src = "https://cdn.tailwindcss.com"></script>
</head>
<body class = "bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8 font-sans selection:bg-purple-500 selection:text-white">


    <div class = "max-w-4xl mx-auto space-y-6">
        
        <header class = "bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            <!-- Декоративный элемент -->
            <div class = "absolute top-0 right-0 w-32 h-32 bg-purple-500 rounded-full blur-3xl opacity-20 -mr-10 -mt-10"></div>
            
            <h1 class = "text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-2 relative z-10">
                GameHub: Логистический ИИ-Терминал
            </h1>
            <p class = "text-slate-400 text-sm sm:text-base relative z-10">
                Автономный комплекс сортировки данных с применением нейросетевого анализа и функциональных пайплайнов массивов.
            </p>
        </header>

        <section class = "grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Панель управления -->
            <div class = "lg:col-span-1 space-y-4">
                <div class = "bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
                    <h2 class = "text-lg font-semibold text-purple-400 mb-4 flex items-center gap-2">
                        <span>🧠</span> ИИ-Диспетчер
                    </h2>
                    <div class = "space-y-3">
                        <label for = "ai-theme" class = "text-xs text-slate-400 font-medium uppercase tracking-wider">Тематика груза</label>
                        <input type = "text" id = "ai-theme" placeholder = "Напр: Классы кораблей EVE"
                               class = "w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-purple-500 transition placeholder-slate-500 text-sm shadow-inner">
                        <input type = "password" id = "api-key" placeholder = "Gemini API Key (Опционально)"
                               class = "w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-cyan-500 transition placeholder-slate-500 text-sm shadow-inner">
                        
                        <button onclick = "requestAiManifest()" id = "ai-btn"
                                class = "w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-sm font-semibold py-3 px-4 rounded-xl transition-all shadow-lg shadow-purple-900/50 active:scale-[0.98] flex justify-center items-center gap-2">
                            Запросить манифест
                        </button>
                    </div>
                </div>

                <div class = "bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
                    <h2 class = "text-lg font-semibold text-blue-400 mb-4 flex items-center gap-2">
                        <span>⚙️</span> Ручной режим
                    </h2>
                    <button onclick = "runLocalPipeline()"
                            class = "w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white text-sm font-semibold py-3 px-4 rounded-xl transition-all shadow-lg active:scale-[0.98]">
                        Тестовый прогон (Local Data)
                    </button>
                    <button onclick = "clearConsole()"
                            class = "w-full mt-3 bg-slate-900 hover:bg-rose-900/40 border border-rose-900/50 text-rose-400 text-sm font-semibold py-3 px-4 rounded-xl transition-all active:scale-[0.98] flex justify-center items-center gap-2 group">
                        <span class = "group-hover:animate-pulse">⚠️</span> Экстренная очистка (Wipe Data)
                    </button>
                </div>
            </div>
			
			<!-- Главный терминал -->
            <div class = "lg:col-span-2 bg-slate-950 border border-slate-700 rounded-2xl p-2 shadow-2xl flex flex-col h-[500px]">
                <div class = "flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-900 rounded-t-xl">
                    <div class = "flex space-x-2">
                        <div class = "w-3 h-3 rounded-full bg-rose-500"></div>
                        <div class = "w-3 h-3 rounded-full bg-amber-500"></div>
                        <div class = "w-3 h-3 rounded-full bg-emerald-500"></div>
                    </div>
                    <span class = "text-xs text-slate-500 font-mono">system_console.sh</span>
                </div>
                <div id = "console-output" class = "flex-1 overflow-y-auto p-4 space-y-2 font-mono text-sm">
                    <div class = "text-slate-500">// Система готова. Ожидание команд...</div>
                </div>
            </div>

        </section>
    </div>
<script src = "script.js">
</script>
</body>
</html>
